# Reference topology only — documents the containers that
# fabric-samples/test-network/network.sh brings up, so a reader can see the
# pieces described in Section 3.4.1/3.5 without needing Fabric installed.
# This file has not been run in the sandbox that produced the rest of this
# repository (no Docker daemon available there); run the official
# network.sh script on a Docker-enabled machine rather than this file
# directly — Fabric's crypto material (MSP certificates, genesis block) is
# generated by that tooling, not hand-written here.

version: "3.7"

services:
  orderer.example.com:
    image: hyperledger/fabric-orderer:2.5
    environment:
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
    ports:
      - "7050:7050"

  ca_org1:
    image: hyperledger/fabric-ca:1.5
    environment:
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "7054:7054"

  ca_org2:
    image: hyperledger/fabric-ca:1.5
    environment:
      - FABRIC_CA_SERVER_PORT=8054
    ports:
      - "8054:8054"

  peer0.org1.example.com:
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_PEER_ID=peer0.org1.example.com
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_ADDRESS=peer0.org1.example.com:7051
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0:5984
    depends_on:
      - couchdb0
      - orderer.example.com
    ports:
      - "7051:7051"

  couchdb0:
    image: couchdb:3.3
    ports:
      - "5984:5984"

  peer0.org2.example.com:
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_PEER_ID=peer0.org2.example.com
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_PEER_ADDRESS=peer0.org2.example.com:9051
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb1:5984
    depends_on:
      - couchdb1
      - orderer.example.com
    ports:
      - "9051:9051"

  couchdb1:
    image: couchdb:3.3
    ports:
      - "6984:5984"

  # Off-chain data layer (Section 3.4.4) — holds the simulated EHR/EMR
  # records that the blockchain never stores directly; see postgres_schema.sql.
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=offchain_records
      - POSTGRES_USER=consentaccess
      - POSTGRES_PASSWORD=change-me
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_schema.sql:/docker-entrypoint-initdb.d/init.sql

  # Application layer (Section 3.4.1(a)) — the REST wrapper in ../cmd/api,
  # pointed at the Fabric Gateway instead of MockLedger once Steps 3-4 in
  # README.md are complete.
  api:
    build:
      context: ../..
      dockerfile: deployment/Dockerfile.api
    ports:
      - "8080:8080"
    depends_on:
      - peer0.org1.example.com
      - postgres
